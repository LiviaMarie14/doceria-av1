<main>

    <section class="pagina-titulo">

        <div class="container text-center">

            <p class="subtitulo">
                VAMOS CONVERSAR?
            </p>

            <h1>
                Suas Informações
            </h1>

        </div>

    </section>


    <section class="informacoes">

        <div class="container">

            <div class="row g-5 align-items-center">

                <div class="col-lg-6">

                    <h2>
                        Conte um pouquinho sobre você
                    </h2>

                    <p>
                        Preencha seus dados para que possamos
                        preparar tudo com carinho.
                    </p>

                </div>


                <div class="col-lg-6">

                    <form class="formulario">

                        <label for="nome">
                            Nome
                        </label>

                        <input
                            type="text"
                            id="nome"
                            class="form-control"
                            placeholder="Digite seu nome"
                            required>


                        <label for="email">
                            E-mail
                        </label>

                        <input
                            type="email"
                            id="email"
                            class="form-control"
                            placeholder="seuemail@email.com"
                            required>


                        <label for="telefone">
                            Telefone
                        </label>

                        <input
                            type="tel"
                            id="telefone"
                            class="form-control"
                            placeholder="(00) 00000-0000">


                        <label for="mensagem">
                            Observações
                        </label>

                        <textarea
                            id="mensagem"
                            class="form-control"
                            rows="4"
                            placeholder="Alguma observação sobre seu pedido?"></textarea>


                        <button
                            type="submit"
                            class="btn btn-rosa w-100 mt-4">

                            Enviar informações ♡

                        </button>
                    </form>
                </div>
            </div>
        </div>
    </section>
</main>
